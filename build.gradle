plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.18.79'
group = 'com.mdk.cosmetic'

base {
    archivesName = 'MDK-Cosmetic-1.21.1-NeoForge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    enable {
        version = '21.1.265'
        disableRecompilation = true
    }
}


// Optional, built-in JEI integration: the mod runs normally without JEI installed.
repositories {
    maven { url = 'https://maven.blamejared.com' }
    mavenCentral()
}

dependencies {
    compileOnly 'mezz.jei:jei-1.21.1-common-api:19.21.0.246'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.21.0.246'
    // JEI itself must NOT be bundled into MDK Cosmetic or required at runtime.
}

// Release JAR contains only compiled classes, runtime assets and mandatory license.
// Blockbench sources, dev tools and project notes stay in the development ZIP.
tasks.named('jar', Jar) {
    from('LICENSE.md') { into('META-INF'); rename { 'LICENSE-MDK-COSMETIC.txt' } }
    exclude('**/*.bbmodel', '**/*.psd', '**/*.blend', '**/*~', '**/*.bak', '**/*.orig')
    manifest { attributes('Implementation-Title': 'MDK Cosmetic', 'Implementation-Version': project.version) }
}

// Copy the regular produced mod artifact to a clean distribution folder.
tasks.register('prepareRelease', Copy) {
    dependsOn(tasks.named('build'))
    from(layout.buildDirectory.dir('libs')) { include('*.jar'); exclude('*-sources.jar', '*-javadoc.jar') }
    into(layout.buildDirectory.dir('release'))
}

sourceSets { validation { compileClasspath += sourceSets.main.output; runtimeClasspath += sourceSets.main.output } }
configurations { validationImplementation.extendsFrom implementation; validationCompileOnly.extendsFrom compileOnly; validationRuntimeOnly.extendsFrom runtimeOnly }
neoForge {
 addModdingDependenciesTo sourceSets.validation
 mods {
  mdkcosmetic { sourceSet sourceSets.main }
  mdkcosmetic_validation { sourceSet sourceSets.validation }
 }
 runs {
  clientRegressions {
   client(); sourceSet = sourceSets.validation; gameDirectory = file('run/client-regressions')
   systemProperty 'mdkcosmetic.clientRegressions','true'
   programArguments.addAll '--width','854','--height','480'
  }
  clientSmoke {
   client(); sourceSet = sourceSets.validation; gameDirectory = file('run/client-smoke')
   systemProperty 'mdkcosmetic.clientSmoke','true'
   programArguments.addAll '--width','854','--height','480'
  }
  gameTest {
   type = 'gameTestServer'; sourceSet = sourceSets.validation; gameDirectory = file('run/game-test')
   systemProperty 'neoforge.enabledGameTestNamespaces','mdkcosmetic_validation'
  }
 }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
