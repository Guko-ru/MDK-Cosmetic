plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.3'
    id 'maven-publish'
}
version = '1.18.78'
group = 'com.mdk.cosmetic'
base { archivesName = 'MDK-Cosmetic-26.1.2-Fabric' }
repositories { maven { url = 'https://maven.blamejared.com' }; mavenCentral() }
dependencies {
    compileOnly 'mezz.jei:jei-26.1.2-fabric-api:29.53.0.115'
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
loom { accessWidenerPath = file('src/main/resources/mdkcosmetic.accesswidener') }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs','500'] }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand(version: project.version) } }
jar { from('LICENSE.md') { into('META-INF'); rename { 'LICENSE-MDK-COSMETIC.txt' } } }
tasks.register('prepareRelease', Copy) {
    dependsOn tasks.named('jar')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into layout.buildDirectory.dir('release')
}

fabricApi.configureTests {
    createSourceSet = true
    modId = 'mdkcosmetic-gametest'
    enableGameTests = true
    enableClientGameTests = true
    clearRunDirectory = false
    eula = false
}

// Minecraft 26 binds item components only after world loading.
// The full client suite includes model, GPU armor and multiblock-preview smoke checks.
tasks.register('runClientSmoke') { dependsOn tasks.named('runClientGameTest') }
