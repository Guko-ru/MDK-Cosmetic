plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}
version = '1.18.78'
group = 'com.mdk.cosmetic'
base { archivesName = 'MDK-Cosmetic-1.21.7-Fabric' }
repositories { maven { url = 'https://maven.blamejared.com' }; mavenCentral() }
dependencies {
    modCompileOnly 'mezz.jei:jei-1.21.7-fabric-api:23.1.0.8'
    minecraft 'com.mojang:minecraft:1.21.7'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.20.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.129.0+1.21.7'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
loom { accessWidenerPath = file('src/main/resources/mdkcosmetic.accesswidener') }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs','500'] }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand(version: project.version) } }
jar { from('LICENSE.md') { into('META-INF'); rename { 'LICENSE-MDK-COSMETIC.txt' } } }
tasks.register('prepareRelease', Copy) {
    dependsOn tasks.named('remapJar')
    from(tasks.named('remapJar').flatMap { it.archiveFile })
    into layout.buildDirectory.dir('release')
}

fabricApi.configureTests {
    createSourceSet = true
    modId = 'mdkcosmetic-gametest'
    enableGameTests = true
    enableClientGameTests = true
    clearRunDirectory = false
    eula = false
}

loom.runs {
    clientSmoke {
        client()
        source sourceSets.gametest
        name 'MDK Client Startup Check'
        vmArg '-Dmdkcosmetic.clientSmoke=true'
        vmArg '-Xmx2G'
        programArgs '--width', '854', '--height', '480'
        runDir 'run/client-smoke'
    }
}




